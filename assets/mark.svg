<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Planvio">
  <!-- Three keystones in ascending order: the same structural form as the
       Halvyn mark, put into sequence. Plan, then the way through it. -->
  <path d="M4.5 22 L11 22 L9.8 33.5 L6.2 33.5 Z"
        fill="#7FA8BC" stroke="#7FA8BC" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M14.8 14 L22 14 L20.6 33.5 L16.6 33.5 Z"
        fill="#2C6E8F" stroke="#2C6E8F" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M25.8 6.5 L33.5 6.5 L31.8 33.5 L27.6 33.5 Z"
        fill="#1A4A62" stroke="#1A4A62" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
